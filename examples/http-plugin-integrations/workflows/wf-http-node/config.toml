[workflow]
manifest_version = "2.0.0"
id = "wf-http-node"
name = "wf-http-node"

[runtime.defaults]
url = "https://api.example.com/quote"
method = "GET"
headers = { accept = "application/json" }

[[nodes]]
manifest_version = "2.0.0"
id = "request-quote"
kind = "plugin"
plugin = "http-node"
operation = "request"
depends_on = []

[[nodes.inputs]]
target = "url"
source = "run.url"

[[nodes.inputs]]
target = "method"
source = "run.method"

[[nodes.inputs]]
target = "headers"
source = "run.headers"
