[workflow]
manifest_version = "2.0.0"
id = "wf-e2e"
name = "wf-e2e"

[runtime.defaults]
symbol = "BTCUSDT"
secret_token_ref = "secret://ops/slack/webhook#api_token"

[[nodes]]
manifest_version = "2.0.0"
id = "builtin-start"
kind = "builtin"
plugin = "builtin.identity"
operation = "run"
depends_on = []

[[nodes.inputs]]
target = "symbol"

[nodes.inputs.source]
namespace = "run_scoped"
key = "symbol"

[[nodes]]
manifest_version = "2.0.0"
id = "script-node"
kind = "builtin"
plugin = "builtin.script"
operation = "python:scripts/e2e_worker.py"
depends_on = ["builtin-start"]

[[nodes.inputs]]
target = "symbol"

[nodes.inputs.source]
namespace = "run_scoped"
key = "symbol"

[[nodes.inputs]]
target = "token"

[nodes.inputs.source]
namespace = "run_scoped"
key = "secret_token_ref"

[[nodes]]
manifest_version = "2.0.0"
id = "external-node"
kind = "builtin"
plugin = "builtin.external_node"
operation = "node-e2e-plugin"
depends_on = ["script-node"]

[[nodes.inputs]]
target = "symbol"

[nodes.inputs.source]
namespace = "run_scoped"
key = "symbol"

[[nodes.inputs]]
target = "token"

[nodes.inputs.source]
namespace = "run_scoped"
key = "secret_token_ref"

[[nodes]]
manifest_version = "2.0.0"
id = "builtin-finish"
kind = "builtin"
plugin = "builtin.identity"
operation = "run"
depends_on = ["external-node"]

[[nodes.inputs]]
target = "decision"

[nodes.inputs.source]
namespace = "run_scoped"
key = "decision"
