[workflow]
manifest_version = "2.0.0"
id = "wf-e2e"
name = "wf-e2e"

[runtime.defaults]
symbol = "BTCUSDT"
secret_token_ref = "secret://ops/slack/webhook#api_token"

[[nodes]]
manifest_version = "2.0.0"
id = "builtin-start"
kind = "builtin"
plugin = "builtin.identity"
operation = "run"
depends_on = []

[[nodes.inputs]]
target = "symbol"

[nodes.inputs.source]
namespace = "run_scoped"
key = "symbol"

[[nodes]]
manifest_version = "2.0.0"
id = "call-execution"
kind = "subflow"
depends_on = ["builtin-start"]

[nodes.call]
workflow = "wf-e2e-child"

[nodes.call.with]
symbol = "run.symbol"
token = "run.secret_token_ref"

[nodes.call.returns]
decision = "decision"

[[nodes]]
manifest_version = "2.0.0"
id = "builtin-finish"
kind = "builtin"
plugin = "builtin.identity"
operation = "run"
depends_on = ["call-execution"]

[[nodes.inputs]]
target = "decision"

[nodes.inputs.source]
namespace = "subflow_output"
key = "decision"
