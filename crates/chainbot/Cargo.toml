[package]
name = "chainbot"
version = "2.1.4"
edition = "2024"

[dependencies]
petgraph = "0.8.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
toml = "1.0.7"
