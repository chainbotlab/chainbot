manifest_version = "2.0.0"
plugin_id = "stargate-node"
kind = "external_node"
entrypoint = "node.exec.v2"
capabilities = ["node:execute"]
executable = "bin/stargate-node"

[activation]
optional_secret_slots = []

[[operations]]
name = "stargate_prepare_send_token"
summary = "Prepare an unsigned Stargate V2 sendToken action"
input_schema = ["source_chain_id", "stargate", "dstEid", "to", "amountLD", "minAmountLD", "nativeFee", "lzTokenFee", "refundAddress"]
optional_input_schema = ["extraOptions", "composeMsg", "oftCmd", "value"]
output_schema = ["unsigned_action", "metadata"]
kind = "swap"

[[operations]]
name = "stargate_prepare_oft_send"
summary = "Prepare an unsigned OFT send action for Stargate-managed assets"
input_schema = ["source_chain_id", "oft", "dstEid", "to", "amountLD", "minAmountLD", "nativeFee", "lzTokenFee", "refundAddress"]
optional_input_schema = ["extraOptions", "composeMsg", "oftCmd", "value"]
output_schema = ["unsigned_action", "metadata"]
kind = "swap"

[source]
manifest_version = "1.0.0"
install_mode = "build_required"
runtime = "bin"
entry_artifact = "bin/stargate-node"
release_version = "0.1.0"

[source.build]
kind = "cargo"
command = ["cargo", "build", "--release", "--bin", "stargate_node_official_plugin"]
workdir = "crate"

[[source.build.outputs]]
from = "crate/target/release/stargate_node_official_plugin"
to = "bin/stargate-node"
