manifest_version = "2.0.0"
plugin_id = "aster-trigger"
kind = "external_trigger"
entrypoint = "trigger.exec.v1"
capabilities = ["trigger.listen.event"]
executable = "bin/aster-trigger"

[trigger_runtime]
lifecycle = "process_short_lived"
push_callback = "inline_response"
durable_ack = "caller_scope"
host_error_categories = ["transport", "protocol_contract", "plugin_fatal"]

[event_schema]
summary = "Aster market stream payload"
fields = ["exchange", "listener_kind", "stream", "event_id", "payload"]
listener_modes = ["event_log"]

[source]
manifest_version = "1.0.0"
install_mode = "build_required"
runtime = "bin"
entry_artifact = "bin/aster-trigger"
release_version = "0.1.0"

[source.build]
kind = "cargo"
command = ["cargo", "build", "--release", "--bin", "aster_trigger_official_plugin"]
workdir = "crate"

[[source.build.outputs]]
from = "crate/target/release/aster_trigger_official_plugin"
to = "bin/aster-trigger"
