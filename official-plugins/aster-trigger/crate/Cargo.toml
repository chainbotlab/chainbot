[package]
name = "aster_trigger_official_plugin"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
live-qualification = []

[[bin]]
name = "aster_trigger_official_plugin"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
