manifest_version = "2.0.0"
plugin_id = "aster-node"
kind = "external_node"
entrypoint = "node.exec.v2"
capabilities = ["node:execute"]
executable = "bin/aster-node"

[[operations]]
name = "aster_get_server_time"
summary = "Read Aster server time"
input_schema = []
optional_input_schema = ["base_url"]
output_schema = ["server_time"]
kind = "read"

[source]
manifest_version = "1.0.0"
install_mode = "build_required"
runtime = "bin"
entry_artifact = "bin/aster-node"
release_version = "0.1.0"

[source.build]
kind = "cargo"
command = ["cargo", "build", "--release", "--bin", "aster_node_official_plugin"]
workdir = "crate"

[[source.build.outputs]]
from = "crate/target/release/aster_node_official_plugin"
to = "bin/aster-node"
