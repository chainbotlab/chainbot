[package]
name = "solana_node_official_plugin"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
live-qualification = []

[[bin]]
name = "solana_node_official_plugin"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bincode = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-hash = { version = "4", features = ["decode"] }
solana-instruction = { version = "3", features = ["bincode"] }
solana-keypair = "3"
solana-message = { version = "3", features = ["bincode"] }
solana-pubkey = "3"
solana-signer = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-transaction = { version = "3", features = ["bincode"] }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
