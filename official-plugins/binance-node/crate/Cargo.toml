[package]
name = "binance_node_official_plugin"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
live-qualification = []

[[bin]]
name = "binance_node_official_plugin"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"

[dev-dependencies]
axum = "0.8"
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
