manifest_version = "2.0.0"
plugin_id = "uniswap-trigger"
kind = "external_trigger"
entrypoint = "trigger.exec.v1"
capabilities = ["trigger.listen.event"]
executable = "bin/uniswap-trigger"

[activation]
optional_secret_slots = []

[trigger_runtime]
lifecycle = "process_short_lived"
push_callback = "inline_response"
durable_ack = "caller_scope"
host_error_categories = ["transport", "protocol_contract", "plugin_fatal"]

[event_schema]
summary = "Uniswap Router02-compatible price threshold event"
fields = ["chain", "listener_kind", "router", "path", "amount_in", "amount_out", "threshold_out", "comparison", "triggered"]
listener_modes = ["price_threshold"]

[source]
manifest_version = "1.0.0"
install_mode = "build_required"
runtime = "bin"
entry_artifact = "bin/uniswap-trigger"
release_version = "0.1.0"

[source.build]
kind = "cargo"
command = ["cargo", "build", "--release", "--bin", "uniswap_trigger_official_plugin"]
workdir = "crate"

[[source.build.outputs]]
from = "crate/target/release/uniswap_trigger_official_plugin"
to = "bin/uniswap-trigger"
