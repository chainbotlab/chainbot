manifest_version = "2.0.0"
plugin_id = "wormhole-node"
kind = "external_node"
entrypoint = "node.exec.v2"
capabilities = ["node:execute"]
executable = "bin/wormhole-node"

[activation]
optional_secret_slots = []

[[operations]]
name = "wormhole_prepare_ntt_transfer"
summary = "Prepare an unsigned Wormhole NTT transfer action"
input_schema = ["source_chain_id", "ntt_manager", "amount", "recipient", "recipient_chain"]
optional_input_schema = ["refund_address", "queue", "transceiver_instructions", "value"]
output_schema = ["unsigned_action", "metadata"]
kind = "swap"

[[operations]]
name = "wormhole_prepare_message"
summary = "Prepare an unsigned Wormhole core messaging action"
input_schema = ["source_chain_id", "core_bridge", "payload"]
optional_input_schema = ["nonce", "consistency_level", "value"]
output_schema = ["unsigned_action", "metadata"]
kind = "write"

[source]
manifest_version = "1.0.0"
install_mode = "build_required"
runtime = "bin"
entry_artifact = "bin/wormhole-node"
release_version = "0.1.0"

[source.build]
kind = "cargo"
command = ["cargo", "build", "--release", "--bin", "wormhole_node_official_plugin"]
workdir = "crate"

[[source.build.outputs]]
from = "crate/target/release/wormhole_node_official_plugin"
to = "bin/wormhole-node"
