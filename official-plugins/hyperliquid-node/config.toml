manifest_version = "2.0.0"
plugin_id = "hyperliquid-node"
kind = "external_node"
entrypoint = "node.exec.v2"
capabilities = ["node:execute"]
executable = "bin/hyperliquid-node"

[activation]
optional_secret_slots = ["origin_binding"]
requires_allowed_origins = true

[[operations]]
name = "hyperliquid_get_all_mids"
summary = "Fetch all mids from Hyperliquid info API"
input_schema = []
optional_input_schema = ["dex", "base_url"]
output_schema = ["all_mids"]
kind = "read"

[[operations]]
name = "hyperliquid_get_l2_book"
summary = "Fetch L2 book snapshot from Hyperliquid info API"
input_schema = ["coin"]
optional_input_schema = ["nSigFigs", "mantissa", "base_url"]
output_schema = ["l2_book"]
kind = "read"

[[operations]]
name = "hyperliquid_get_candle_snapshot"
summary = "Fetch candle snapshot from Hyperliquid info API"
input_schema = ["coin", "interval", "startTime", "endTime"]
optional_input_schema = ["base_url"]
output_schema = ["candles"]
kind = "read"

[[operations]]
name = "hyperliquid_bridge2_prepare_deposit"
summary = "Prepare an unsigned Arbitrum USDC transfer for Hyperliquid Bridge2 deposit"
input_schema = ["amount"]
optional_input_schema = ["amount_units", "decimals", "chain_id", "bridge", "usdc"]
output_schema = ["unsigned_action", "metadata"]
kind = "swap"

[[operations]]
name = "hyperliquid_bridge2_prepare_withdraw3"
summary = "Prepare the Hyperliquid Bridge2 withdraw3 typed-data payload"
input_schema = ["destination", "amount", "time"]
optional_input_schema = ["signatureChainId", "hyperliquidChain"]
output_schema = ["typed_data", "hyperliquid_action", "metadata"]
kind = "swap"

[[operations]]
name = "hyperliquid_bridge2_prepare_deposit_with_permit"
summary = "Prepare Bridge2 deposit-with-permit typed data and unsigned Arbitrum action"
input_schema = ["owner", "value", "nonce", "deadline"]
optional_input_schema = ["chain_id", "bridge", "usdc", "call_data"]
output_schema = ["permit_typed_data", "unsigned_action", "metadata"]
kind = "swap"

[source]
manifest_version = "1.0.0"
install_mode = "build_required"
runtime = "bin"
entry_artifact = "bin/hyperliquid-node"
release_version = "0.1.0"

[source.build]
kind = "cargo"
command = ["cargo", "build", "--release", "--bin", "hyperliquid_node_official_plugin"]
workdir = "crate"

[[source.build.outputs]]
from = "crate/target/release/hyperliquid_node_official_plugin"
to = "bin/hyperliquid-node"
